          height="24"
          viewBox="0 0 24 24"
          fill="none"

          stroke-width="1.5"
          stroke-linecap="round"

          <polyline points="14 2 14 8 20 8"></polyline>

          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
        <span>Open PDF Document...</span>
      </button>
    </div>

    <!-- VIEWER -->
    <main id="pdf-viewer-container">

          <input type="text" id="pdf-page-count" name="currentPage" value="" />
        </span>
        <span id="pdf-total-pages"></span>
