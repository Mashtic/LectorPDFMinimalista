<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector PDF Minimalista</title>
  <style>
    /* INICIO MODIFICACIÓN DE VICTOR
       Estilos para abrir y leer uno o dos PDF en la misma ventana. */
    :root { color-scheme: dark; font-family: Arial, sans-serif; background: #202124; }
    * { box-sizing: border-box; }
    body { height: 100vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; }
    #toolbar { display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 12px 18px; background: #303134; border-bottom: 1px solid #4a4d51; }
    .open-button { display: inline-flex; align-items: center; min-height: 36px; padding: 0 14px; border-radius: 5px; background: #8ab4f8; color: #202124; font-size: 14px; font-weight: bold; cursor: pointer; }
    .open-button:hover { background: #a8c7fa; }
    #file-input { display: none; }
    #mode-message { color: #bdc1c6; font-size: 14px; }
    #readers { flex: 1; display: flex; min-height: 0; background: #525659; }
    .reader-pane { display: none; flex: 1 1 50%; min-width: 0; flex-direction: column; border-left: 1px solid #696b6f; }
    .reader-pane:first-child { border-left: 0; }
    .reader-pane.visible { display: flex; }
    .reader-pane.active { outline: 2px solid #8ab4f8; outline-offset: -2px; }
    .pane-header { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; background: #3c4043; color: #e8eaed; font-size: 13px; }
    .file-name { overflow: hidden; flex: 1; white-space: nowrap; text-overflow: ellipsis; }
    .close-pane { width: 24px; height: 24px; border: 0; border-radius: 50%; background: transparent; color: #e8eaed; font-size: 20px; line-height: 20px; cursor: pointer; }
    .close-pane:hover { background: #5f6368; }
    .viewer { flex: 1; width: 100%; border: 0; background: #525659; }
    #empty-state { position: absolute; inset: 62px 0 0; display: grid; place-items: center; color: #e8eaed; text-align: center; pointer-events: none; }
    #empty-state p { margin: 6px; color: #bdc1c6; }
    #empty-state.hidden { display: none; }
    #choice-dialog { width: min(420px, calc(100vw - 32px)); padding: 0; border: 1px solid #5f6368; border-radius: 8px; background: #303134; color: #e8eaed; box-shadow: 0 12px 32px rgba(0, 0, 0, .45); }
    #choice-dialog::backdrop { background: rgba(0, 0, 0, .55); }
    .dialog-content { padding: 22px; }
    .dialog-content h2 { margin: 0 0 10px; font-size: 19px; }
    .dialog-content p { margin: 0; color: #bdc1c6; line-height: 1.45; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 22px; }
    .dialog-actions button { min-height: 36px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; color: #8ab4f8; font-weight: bold; cursor: pointer; }
    .dialog-actions button.primary { background: #8ab4f8; color: #202124; }
    .dialog-actions button:hover { background: #3c4043; }
    .dialog-actions button.primary:hover { background: #a8c7fa; }
    @media (max-width: 700px) { #toolbar { min-height: 72px; flex-wrap: wrap; } #empty-state { inset: 72px 0 0; } #readers.split { flex-direction: column; overflow: auto; } #readers.split .reader-pane { min-height: 50%; } }
    /* FIN MODIFICACIÓN DE VICTOR */
  </style>
</head>
<body>
  <!-- INICIO MODIFICACIÓN DE VICTOR
       Interfaz con dos visores y elección entre reemplazar o abrir dos PDF a la vez. -->
  <header id="toolbar">
    <label class="open-button" for="file-input">Abrir PDF</label>
    <input type="file" id="file-input" accept="application/pdf,.pdf">
    <span id="mode-message">Selecciona un archivo PDF para comenzar.</span>
  </header>
  <main id="readers" aria-label="Visores de documentos PDF">
    <section class="reader-pane" id="pane-1" data-pane="0">
      <div class="pane-header"><span class="file-name">Documento 1</span><button class="close-pane" type="button" aria-label="Cerrar documento 1" title="Cerrar documento">×</button></div>
      <iframe class="viewer" title="Documento PDF 1"></iframe>
    </section>
    <section class="reader-pane" id="pane-2" data-pane="1">
      <div class="pane-header"><span class="file-name">Documento 2</span><button class="close-pane" type="button" aria-label="Cerrar documento 2" title="Cerrar documento">×</button></div>
      <iframe class="viewer" title="Documento PDF 2"></iframe>
    </section>
  </main>
  <div id="empty-state"><div><h1>Lector PDF</h1><p>Abre un PDF para leerlo.</p></div></div>
  <dialog id="choice-dialog" aria-labelledby="dialog-title">
    <div class="dialog-content">
      <h2 id="dialog-title">Ya hay un PDF abierto</h2>
      <p>¿Quieres reemplazar el documento actual o leer ambos documentos al mismo tiempo?</p>
      <div class="dialog-actions"><button id="cancel-choice" type="button">Cancelar</button><button id="replace-choice" type="button">Abrir uno nuevo</button><button id="split-choice" class="primary" type="button">Abrir en simultáneo</button></div>
    </div>
  </dialog>
  <script>
    // INICIO MODIFICACIÓN DE VICTOR
    // Controla la carga, el cierre y la visualización simultánea de los PDF.
    const { pathToFileURL } = require('url');
    const { webUtils } = require('electron');
    const fileInput = document.getElementById('file-input');
    const readers = document.getElementById('readers');
    const emptyState = document.getElementById('empty-state');
    const modeMessage = document.getElementById('mode-message');
    const dialog = document.getElementById('choice-dialog');
    const panes = [...document.querySelectorAll('.reader-pane')];
    let activePane = 0;
    let pendingFile = null;

    function openFileInPane(file, index) {
      const pane = panes[index];
      // Desde Electron 32, File.path ya no está disponible. webUtils es la
      // API oficial para obtener la ruta local que necesita el iframe.
      const filePath = webUtils.getPathForFile(file);
      pane.querySelector('.viewer').src = pathToFileURL(filePath).href;
      pane.querySelector('.file-name').textContent = file.name;
      pane.querySelector('.viewer').title = `Documento PDF: ${file.name}`;
      pane.classList.add('visible');
      setActivePane(index);
      updateLayout();
    }

    function setActivePane(index) {
      activePane = index;
      panes.forEach((pane, paneIndex) => pane.classList.toggle('active', paneIndex === index && pane.classList.contains('visible')));
    }

    function visiblePanes() { return panes.filter((pane) => pane.classList.contains('visible')); }

    function updateLayout() {
      const count = visiblePanes().length;
      readers.classList.toggle('split', count === 2);
      emptyState.classList.toggle('hidden', count !== 0);
      modeMessage.textContent = count === 0 ? 'Selecciona un archivo PDF para comenzar.' : count === 1 ? 'Abre otro PDF para reemplazarlo o verlo en simultáneo.' : 'Modo simultáneo: cada panel tiene sus propias páginas y controles.';
    }

    function closePane(index) {
      const pane = panes[index];
      pane.querySelector('.viewer').src = 'about:blank';
      pane.classList.remove('visible', 'active');
      const remaining = visiblePanes();
      if (remaining.length === 1) setActivePane(Number(remaining[0].dataset.pane));
      updateLayout();
    }

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      fileInput.value = '';
      if (!file) return;
      const openCount = visiblePanes().length;
      if (openCount === 0) openFileInPane(file, 0);
      else if (openCount === 1) { pendingFile = file; dialog.showModal(); }
      else openFileInPane(file, activePane);
    });

    document.getElementById('replace-choice').addEventListener('click', () => { if (pendingFile) openFileInPane(pendingFile, activePane); pendingFile = null; dialog.close(); });
    document.getElementById('split-choice').addEventListener('click', () => { const availablePane = panes.findIndex((pane) => !pane.classList.contains('visible')); if (pendingFile && availablePane !== -1) openFileInPane(pendingFile, availablePane); pendingFile = null; dialog.close(); });
    document.getElementById('cancel-choice').addEventListener('click', () => { pendingFile = null; dialog.close(); });
    panes.forEach((pane, index) => {
      pane.addEventListener('pointerdown', () => setActivePane(index));
      pane.querySelector('.close-pane').addEventListener('click', (event) => { event.stopPropagation(); closePane(index); });
    });
    // FIN MODIFICACIÓN DE VICTOR
  </script>
  <!-- FIN MODIFICACIÓN DE VICTOR -->
</body>
</html>
