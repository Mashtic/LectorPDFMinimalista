<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Lector PDF Minimalista</title>
    <style>
        /* Estilos base Typora */
        :root {
            --bg-color: #FAFAFA;
            --text-muted: #999999;
            --text-hover: #333333;
        }

        body, html {
            height: 100vh; 
            margin: 0; 
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }

        /* Barra para arrastrar ventana en Electron */
        #title-bar {
            height: 32px;
            width: 100%;
            position: fixed;
            top: 0;
            left: 0;
            -webkit-app-region: drag;
            z-index: 9999;
        }

        /* Botón de Modo Flotante (discreto en la esquina) */
        #floating-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 10000;
            -webkit-app-region: no-drag;
            padding: 4px 10px;
            font-size: 11px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        #floating-toggle:hover {
            color: var(--text-hover);
            border-color: #999;
        }
        #floating-toggle.active { 
            background: #2e8b57; 
            color: white; 
            border-color: #3ca66b; 
        }

        /* Pantalla central */
        #welcome-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            width: 100%;
        }

        /* Convertimos tu OpenFileBtn original en el botón minimalista */
        #OpenFileBtn {
            -webkit-app-region: no-drag;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 20px 40px;
            border-radius: 8px;
            border: none;
            background: transparent;
            font-size: 15px;
            transition: all 0.2s ease-in-out;
        }

        #OpenFileBtn svg {
            transition: transform 0.2s ease;
        }

        #OpenFileBtn:hover {
            color: var(--text-hover);
            background-color: rgba(0, 0, 0, 0.03);
        }

        #OpenFileBtn:hover svg {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div id="title-bar"></div>

    <!-- Tu botón de modo flotante ahora es minimalista -->
    <button id="floating-toggle" type="button" aria-pressed="false">Normal</button>

    <div id="welcome-screen">
        <!-- Este es TU botón original, pero vestido de Typora -->
        <button id="OpenFileBtn" type="button">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="12" y1="18" x2="12" y2="12"></line>
                <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
            <span>Abrir documento PDF...</span>
        </button>
    </div>

    <!-- Lógica nativa conservada para tu botón flotante -->
    <script>
        const floatingToggle = document.getElementById('floating-toggle');
        const { ipcRenderer } = require('electron');

        let isFloating = false;

        floatingToggle.addEventListener('click', () => {
            isFloating = !isFloating;
            floatingToggle.textContent = isFloating ? 'Flotante' : 'Normal';
            floatingToggle.classList.toggle('active', isFloating);
            floatingToggle.setAttribute('aria-pressed', String(isFloating));
            ipcRenderer.send('set-floating-mode', isFloating);
        });
    </script>
    
    <!-- Lógica de apertura de archivos conservada intacta -->
    <script type="module" src="./renderer.js"></script>
</body>
</html>
